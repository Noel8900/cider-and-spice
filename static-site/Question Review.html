<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Review — Cider &amp; Spice Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; -webkit-font-smoothing: antialiased; }
    body { background: #0D0B08; color: #E8D3A5; font-family: Inter, system-ui, sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #0a0908; } ::-webkit-scrollbar-thumb { background: rgba(212,168,75,.18); border-radius: 2px; }
    ::selection { background: rgba(196,98,45,.3); color: #F7F3EC; }
    input, textarea { font-family: inherit; }
    input:focus, textarea:focus { outline: 1px solid rgba(196,98,45,.5); }
    @keyframes adm-fade { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="80" fill="#0D0B08"/>
      <rect x="10" y="18" width="100" height="12" rx="2" fill="rgba(196,98,45,.15)" stroke="rgba(196,98,45,.3)" stroke-width=".5"/>
      <rect x="10" y="34" width="100" height="12" rx="2" fill="rgba(255,255,255,.04)" stroke="rgba(232,211,165,.08)" stroke-width=".5"/>
      <rect x="10" y="50" width="100" height="12" rx="2" fill="rgba(255,255,255,.04)" stroke="rgba(232,211,165,.08)" stroke-width=".5"/>
      <circle cx="20" cy="24" r="3" fill="#C4622D"/>
      <circle cx="20" cy="40" r="3" fill="rgba(212,168,75,.4)"/>
      <circle cx="20" cy="56" r="3" fill="rgba(79,152,163,.5)"/>
      <text x="60" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="5" fill="rgba(232,211,165,.3)">Admin · Question Review</text>
    </svg>
  </template>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const A = {
  bg: '#0D0B08', bgSurf: '#131109', bgCard: '#181510',
  cream: '#E8D3A5', cream2: 'rgba(232,211,165,.55)', cream3: 'rgba(232,211,165,.28)',
  tc: '#C4622D', gold: '#D4A84B', teal: '#4F98A3',
  border: 'rgba(232,211,165,.08)', borderMid: 'rgba(232,211,165,.14)',
};

const STATUS_CFG = {
  new:      { label: 'New',      color: A.tc,   bg: 'rgba(196,98,45,.12)'  },
  reviewed: { label: 'Reviewed', color: A.gold,  bg: 'rgba(212,168,75,.10)' },
  answered: { label: 'Answered', color: A.teal,  bg: 'rgba(79,152,163,.10)' },
  archived: { label: 'Archived', color: A.cream3, bg: 'rgba(255,255,255,.04)' },
};

const PASSCODE = '2027';

function useQuestions() {
  const [questions, setQuestions] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('cs_questions') || '[]'); } catch { return []; }
  });
  const save = qs => { localStorage.setItem('cs_questions', JSON.stringify(qs)); setQuestions(qs); };
  const update = (id, patch) => save(questions.map(q => q.id === id ? { ...q, ...patch } : q));
  const remove = id => save(questions.filter(q => q.id !== id));
  const clear  = () => { if (window.confirm('Delete ALL questions?')) save([]); };
  const addDemo = () => {
    const demos = [
      { id: Date.now()-5000, name: 'Maria G.', email: 'maria@example.com', question: 'Do you accept applications from home bakers or do vendors need a commercial kitchen license already?', ts: new Date(Date.now()-3600000*2).toISOString(), status: 'new' },
      { id: Date.now()-4000, name: 'James T.', email: 'james@example.com', question: 'What is the minimum commitment for a vendor stall? Can I do a pop-up for just a few months?', ts: new Date(Date.now()-3600000*5).toISOString(), status: 'new' },
      { id: Date.now()-3000, name: 'Sofia R.', email: '', question: 'Is there outdoor seating? I have young kids and would love to know the family vibe of the place.', ts: new Date(Date.now()-3600000*18).toISOString(), status: 'reviewed', note: 'Yes — outdoor patio with shade sails, family friendly' },
      { id: Date.now()-2000, name: 'Daniel L.', email: 'daniel@example.com', question: 'I run a small cidery in Albuquerque — how can I get our cider on tap at the bar?', ts: new Date(Date.now()-86400000).toISOString(), status: 'answered' },
      { id: Date.now()-1000, name: 'Priya M.', email: 'priya@example.com', question: 'What is the timeline for the incubator program? And is there a cost beyond the stall rent?', ts: new Date(Date.now()-86400000*2).toISOString(), status: 'new' },
    ];
    const existing = questions.filter(q => !demos.some(d => d.name === q.name));
    save([...demos, ...existing]);
  };

  return { questions, update, remove, clear, addDemo };
}

// ── Lock screen ──────────────────────────────────────────────────────────────
function LockScreen({ onUnlock }) {
  const [pin, setPin] = React.useState('');
  const [err, setErr] = React.useState(false);
  const submit = e => {
    e.preventDefault();
    if (pin === PASSCODE) { onUnlock(); }
    else { setErr(true); setPin(''); setTimeout(() => setErr(false), 1800); }
  };
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: A.bg, padding: 24 }}>
      <div style={{ marginBottom: 32, textAlign: 'center' }}>
        <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 28, fontWeight: 300, color: A.cream, marginBottom: 4 }}>Cider <em style={{ fontStyle:'italic', color:A.tc }}>&amp;</em> Spice</div>
        <div style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.3em', textTransform: 'uppercase', color: A.cream3 }}>Admin · Question Review</div>
      </div>
      <form onSubmit={submit} style={{ width: '100%', maxWidth: 320, display: 'flex', flexDirection: 'column', gap: 12 }}>
        <input type="password" autoFocus value={pin} onChange={e => setPin(e.target.value)} placeholder="Enter passcode"
          style={{ background: err?'rgba(196,98,45,.1)':'rgba(255,255,255,.04)', border: `1px solid ${err?'rgba(196,98,45,.6)':A.border}`, padding: '14px 18px', fontFamily: 'Inter,sans-serif', fontSize: 16, color: A.cream, textAlign: 'center', letterSpacing: '.25em', transition: 'border-color .3s', outline:'none' }} />
        {err && <div style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.2em', textTransform: 'uppercase', color: A.tc, textAlign: 'center' }}>Incorrect passcode</div>}
        <button type="submit" style={{ background: A.tc, color: '#F7F3EC', border: 'none', padding: '13px', fontFamily: "'Josefin Sans',sans-serif", fontSize: 9, letterSpacing: '.24em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600 }}>Unlock →</button>
      </form>
      <p style={{ fontFamily: 'Inter,sans-serif', fontSize: 11, color: A.cream3, marginTop: 20, opacity:.5 }}>Demo passcode: 2027</p>
    </div>
  );
}

// ── Question card ────────────────────────────────────────────────────────────
function QCard({ q, onUpdate, onRemove }) {
  const [expanded, setExpanded] = React.useState(false);
  const [note, setNote]         = React.useState(q.note || '');
  const [editing, setEditing]   = React.useState(false);
  const cfg = STATUS_CFG[q.status];
  const age = (() => {
    const diff = Date.now() - new Date(q.ts).getTime();
    if (diff < 3600000)   return `${Math.round(diff/60000)}m ago`;
    if (diff < 86400000)  return `${Math.round(diff/3600000)}h ago`;
    return `${Math.round(diff/86400000)}d ago`;
  })();

  return (
    <div style={{ background: expanded ? A.bgCard : A.bgSurf, border: `1px solid ${expanded ? A.borderMid : A.border}`, transition: 'all .3s' }}>
      {/* Status stripe */}
      <div style={{ height: 2, background: cfg.color, opacity: .7 }} />
      {/* Header row */}
      <div style={{ padding: '16px 20px', display: 'flex', alignItems: 'center', gap: 14, cursor: 'pointer', flexWrap: 'wrap' }} onClick={() => { setExpanded(e => !e); if (q.status === 'new') onUpdate(q.id, { status: 'reviewed' }); }}>
        {/* Avatar */}
        <div style={{ width: 36, height: 36, borderRadius: '50%', background: `${cfg.color}22`, border: `1px solid ${cfg.color}44`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <span style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 16, fontWeight: 300, color: cfg.color }}>{q.name.charAt(0)}</span>
        </div>
        {/* Name + question preview */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 3 }}>
            <span style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 17, fontWeight: 300, color: A.cream }}>{q.name}</span>
            {q.email && <span style={{ fontFamily: 'Inter,sans-serif', fontSize: 11, color: A.cream3 }}>{q.email}</span>}
            <span style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 7, letterSpacing: '.2em', textTransform: 'uppercase', padding: '2px 8px', color: cfg.color, background: cfg.bg, border: `1px solid ${cfg.color}33` }}>{cfg.label}</span>
            <span style={{ fontFamily: 'Inter,sans-serif', fontSize: 11, color: A.cream3, marginLeft: 'auto' }}>{age}</span>
          </div>
          <p style={{ fontFamily: 'Inter,sans-serif', fontSize: 13, color: A.cream2, lineHeight: 1.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: expanded ? 'normal' : 'nowrap' }}>{q.question}</p>
        </div>
        {/* Chevron */}
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={A.cream3} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, transition: 'transform .3s', transform: expanded ? 'rotate(180deg)' : 'none' }}><path d="M6 9l6 6 6-6"/></svg>
      </div>

      {/* Expanded detail */}
      {expanded && (
        <div style={{ padding: '0 20px 20px', borderTop: `1px solid ${A.border}` }}>
          {/* Full question */}
          <div style={{ margin: '16px 0 20px', padding: '16px 18px', background: 'rgba(255,255,255,.025)', borderLeft: `2px solid ${cfg.color}55` }}>
            <p style={{ fontFamily: 'Inter,sans-serif', fontSize: 14, lineHeight: 1.78, color: A.cream2 }}>{q.question}</p>
            <div style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 7.5, letterSpacing: '.18em', textTransform: 'uppercase', color: A.cream3, marginTop: 10 }}>
              Submitted {new Date(q.ts).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' })}
            </div>
          </div>

          {/* Internal note */}
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.22em', textTransform: 'uppercase', color: A.cream3, marginBottom: 8 }}>Internal Note / Draft Reply</div>
            {editing ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <textarea rows={3} value={note} onChange={e => setNote(e.target.value)}
                  style={{ background: 'rgba(255,255,255,.04)', border: `1px solid ${A.border}`, padding: '10px 14px', fontFamily: 'Inter,sans-serif', fontSize: 13, color: A.cream, resize: 'vertical', lineHeight: 1.6, outline: 'none' }} />
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => { onUpdate(q.id, { note }); setEditing(false); }} style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.2em', textTransform: 'uppercase', padding: '8px 18px', background: A.tc, color: '#F7F3EC', border: 'none', cursor: 'pointer' }}>Save Note</button>
                  <button onClick={() => setEditing(false)} style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.2em', textTransform: 'uppercase', padding: '8px 18px', background: 'transparent', color: A.cream3, border: `1px solid ${A.border}`, cursor: 'pointer' }}>Cancel</button>
                </div>
              </div>
            ) : (
              <div onClick={() => setEditing(true)} style={{ padding: '10px 14px', background: 'rgba(255,255,255,.025)', border: `1px solid ${A.border}`, cursor: 'text', minHeight: 42 }}>
                <p style={{ fontFamily: 'Inter,sans-serif', fontSize: 13, color: note ? A.cream2 : A.cream3, lineHeight: 1.6, fontStyle: note ? 'normal' : 'italic' }}>{note || 'Click to add a note or draft reply…'}</p>
              </div>
            )}
          </div>

          {/* Actions */}
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center' }}>
            <div style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 7.5, letterSpacing: '.18em', textTransform: 'uppercase', color: A.cream3, marginRight: 4 }}>Mark as:</div>
            {Object.entries(STATUS_CFG).map(([k, cfg]) => (
              <button key={k} onClick={() => onUpdate(q.id, { status: k })}
                style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 7.5, letterSpacing: '.18em', textTransform: 'uppercase', padding: '6px 14px', cursor: 'pointer', border: `1px solid ${q.status===k?cfg.color+'66':A.border}`, background: q.status===k?cfg.bg:'transparent', color: q.status===k?cfg.color:A.cream3, transition: 'all .2s' }}
                onMouseEnter={e => { if (q.status!==k) { e.currentTarget.style.borderColor=cfg.color+'44'; e.currentTarget.style.color=cfg.color; }}}
                onMouseLeave={e => { if (q.status!==k) { e.currentTarget.style.borderColor=A.border; e.currentTarget.style.color=A.cream3; }}}
              >{cfg.label}</button>
            ))}
            <button onClick={() => { if (window.confirm(`Delete question from ${q.name}?`)) onRemove(q.id); }}
              style={{ marginLeft: 'auto', fontFamily: "'Josefin Sans',sans-serif", fontSize: 7.5, letterSpacing: '.18em', textTransform: 'uppercase', padding: '6px 14px', cursor: 'pointer', border: `1px solid rgba(196,98,45,.2)`, background: 'transparent', color: 'rgba(196,98,45,.45)', transition: 'all .2s' }}
              onMouseEnter={e => { e.currentTarget.style.borderColor='rgba(196,98,45,.5)'; e.currentTarget.style.color=A.tc; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor='rgba(196,98,45,.2)'; e.currentTarget.style.color='rgba(196,98,45,.45)'; }}
            >Delete</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Main app ─────────────────────────────────────────────────────────────────
function App() {
  const [unlocked, setUnlocked] = React.useState(() => sessionStorage.getItem('cs_admin_auth') === '1');
  const [filter,   setFilter]   = React.useState('all');
  const [search,   setSearch]   = React.useState('');
  const { questions, update, remove, clear, addDemo } = useQuestions();
  const [tick, setTick] = React.useState(0);

  const unlock = () => { sessionStorage.setItem('cs_admin_auth', '1'); setUnlocked(true); };

  // Poll for new questions every 8 seconds
  React.useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 8000);
    return () => clearInterval(id);
  }, []);

  if (!unlocked) return <LockScreen onUnlock={unlock} />;

  const filtered = questions.filter(q => {
    const matchFilter = filter === 'all' || q.status === filter;
    const matchSearch = !search || q.name.toLowerCase().includes(search.toLowerCase()) || q.question.toLowerCase().includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  const counts = Object.fromEntries(Object.keys(STATUS_CFG).map(k => [k, questions.filter(q => q.status === k).length]));
  const newCount = counts.new || 0;

  return (
    <div style={{ minHeight: '100vh', background: A.bg }}>
      {/* Top bar */}
      <div style={{ position: 'sticky', top: 0, zIndex: 50, background: 'rgba(13,11,8,.96)', backdropFilter: 'blur(12px)', borderBottom: `1px solid ${A.border}`, padding: '0 clamp(16px,3vw,36px)', height: 56, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <a href="Cider & Spice — Homepage.html" style={{ display:'flex', alignItems:'center', gap:8, textDecoration:'none' }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={A.cream3} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
          </a>
          <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 18, fontWeight: 300, color: A.cream, letterSpacing: '-.01em' }}>Cider <em style={{ fontStyle: 'italic', color: A.tc }}>&amp;</em> Spice</div>
          <div style={{ width: 1, height: 16, background: A.border }} />
          <div style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.26em', textTransform: 'uppercase', color: A.cream3 }}>Question Review</div>
          {newCount > 0 && <div style={{ background: A.tc, color: '#F7F3EC', fontFamily: 'Inter,sans-serif', fontSize: 11, fontWeight: 600, width: 20, height: 20, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{newCount}</div>}
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <button onClick={addDemo} style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 7.5, letterSpacing: '.18em', textTransform: 'uppercase', padding: '6px 14px', background: 'transparent', border: `1px solid ${A.border}`, color: A.cream3, cursor: 'pointer', transition: 'all .2s' }}
            onMouseEnter={e => { e.currentTarget.style.borderColor=A.borderMid; e.currentTarget.style.color=A.cream; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor=A.border; e.currentTarget.style.color=A.cream3; }}
          >+ Load Demo Data</button>
          <button onClick={() => { sessionStorage.removeItem('cs_admin_auth'); setUnlocked(false); }} style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 7.5, letterSpacing: '.18em', textTransform: 'uppercase', padding: '6px 14px', background: 'transparent', border: `1px solid ${A.border}`, color: A.cream3, cursor: 'pointer' }}>Lock</button>
        </div>
      </div>

      <div style={{ maxWidth: 1100, margin: '0 auto', padding: 'clamp(24px,4vw,48px) clamp(16px,3vw,36px)' }}>
        {/* Stats strip */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(140px,1fr))', gap: 2, marginBottom: 28 }}>
          {[['all', 'Total', questions.length], ...Object.entries(STATUS_CFG).map(([k, cfg]) => [k, cfg.label, counts[k] || 0])].map(([k, label, count]) => (
            <button key={k} onClick={() => setFilter(k)}
              style={{ padding: '14px 18px', background: filter===k?`${k==='all'?'rgba(255,255,255,.04)':STATUS_CFG[k]?.bg||'rgba(255,255,255,.04)'}`:A.bgSurf, border: `1px solid ${filter===k?k==='all'?A.borderMid:STATUS_CFG[k]?.color+'44'||A.border:A.border}`, cursor: 'pointer', textAlign: 'left', transition: 'all .25s' }}>
              <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 28, fontWeight: 300, color: k==='all'?A.cream:STATUS_CFG[k]?.color||A.cream, lineHeight: 1 }}>{count}</div>
              <div style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 7.5, letterSpacing: '.2em', textTransform: 'uppercase', color: A.cream3, marginTop: 5 }}>{label}</div>
            </button>
          ))}
        </div>

        {/* Search */}
        <div style={{ position: 'relative', marginBottom: 16 }}>
          <svg style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none' }} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={A.cream3} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Search by name or question…" value={search} onChange={e => setSearch(e.target.value)}
            style={{ width: '100%', background: A.bgSurf, border: `1px solid ${A.border}`, padding: '11px 14px 11px 38px', fontFamily: 'Inter,sans-serif', fontSize: 13, color: A.cream }} />
        </div>

        {/* Question list */}
        {filtered.length === 0 ? (
          <div style={{ padding: '64px 24px', textAlign: 'center', border: `1px solid ${A.border}`, background: A.bgSurf }}>
            <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 22, fontWeight: 300, color: A.cream3, marginBottom: 10 }}>
              {questions.length === 0 ? 'No questions yet' : 'No results'}
            </div>
            <p style={{ fontFamily: 'Inter,sans-serif', fontSize: 13, color: A.cream3, opacity: .6, marginBottom: 20 }}>
              {questions.length === 0 ? 'Questions submitted on the homepage will appear here. Load demo data to preview.' : 'Try a different search or filter.'}
            </p>
            {questions.length === 0 && (
              <button onClick={addDemo} style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8.5, letterSpacing: '.2em', textTransform: 'uppercase', padding: '11px 24px', background: A.tc, color: '#F7F3EC', border: 'none', cursor: 'pointer', fontWeight: 600 }}>Load Demo Questions</button>
            )}
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {filtered.map(q => <QCard key={q.id} q={q} onUpdate={update} onRemove={remove} />)}
          </div>
        )}

        {/* Bottom actions */}
        {questions.length > 0 && (
          <div style={{ marginTop: 24, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
            <span style={{ fontFamily: 'Inter,sans-serif', fontSize: 12, color: A.cream3 }}>{filtered.length} of {questions.length} question{questions.length !== 1 ? 's' : ''}</span>
            <button onClick={clear} style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 7.5, letterSpacing: '.18em', textTransform: 'uppercase', padding: '7px 16px', background: 'transparent', border: `1px solid rgba(196,98,45,.2)`, color: 'rgba(196,98,45,.4)', cursor: 'pointer', transition: 'all .2s' }}
              onMouseEnter={e => { e.currentTarget.style.borderColor='rgba(196,98,45,.5)'; e.currentTarget.style.color=A.tc; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor='rgba(196,98,45,.2)'; e.currentTarget.style.color='rgba(196,98,45,.4)'; }}
            >Clear All</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
