<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="hos-nav.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hall OS · Vendor Dashboard · Yazzie</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Josefin+Sans:wght@400;500;600&display=swap" />
<style>
  :root {
    --bg:#1C1209; --bg-deep:#100E0A; --bg-band:#150F08;
    --surface:rgba(245,236,215,0.025); --surface-2:rgba(245,236,215,0.05);
    --border:rgba(245,236,215,0.10); --border-m:rgba(245,236,215,0.16); --border-s:rgba(245,236,215,0.06);
    --cream:#F5ECD7; --parchment:#F7F3EC; --wheat:#E8C18D;
    --muted:rgba(245,236,215,0.55); --faint:rgba(245,236,215,0.36);
    --primary:#C4622D; --primary-hi:#D67841; --primary-dim:rgba(196,98,45,0.16);
    --gold:#D4A84B;
    --green:#4B9B6E; --green-dim:rgba(75,155,110,0.12);
    --red:#C44B4B; --red-dim:rgba(196,75,75,0.12);
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
    --caps:'Josefin Sans',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--cream);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}

  .shell{display:grid;grid-template-rows:52px 1fr;min-height:100vh;}

  /* Header */
  .hdr{
    position:sticky;top:0;z-index:100;
    background:var(--bg-deep);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:0 20px;
  }
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;}
  .bmark{
    width:28px;height:28px;border-radius:6px;
    background:linear-gradient(140deg,var(--primary),var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-style:italic;font-size:15px;color:#1e1710;
  }
  .bname{font-family:var(--serif);font-size:16px;color:var(--cream);line-height:1;}
  .bname em{font-style:italic;color:var(--primary);}
  .vsep{width:1px;height:18px;background:var(--border);}
  .vbadge{
    display:flex;align-items:center;gap:7px;
    font-family:var(--caps);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--gold);
  }
  .live-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 3px rgba(75,155,110,0.18);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(75,155,110,0.18);}50%{box-shadow:0 0 0 7px rgba(75,155,110,0.04);}}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .nav-back{
    font-family:var(--caps);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--faint);text-decoration:none;
    padding:5px 10px;border:1px solid var(--border);
    transition:color 0.15s,border-color 0.15s;
  }
  .nav-back:hover{color:var(--cream);border-color:var(--border-m);}

  /* Content wrapper */
  .content{overflow:auto;}

  #root{min-height:calc(100vh - 52px);}
</style>
</head>
<body>

<div class="shell">
  <header class="hdr">
    <a class="brand" href="Hall OS Index.html">
      <div class="bmark">&amp;</div>
      <div class="bname">Hall <em>OS</em></div>
    </a>
    <div class="vsep"></div>
    <div class="vbadge">
      <div class="live-dot"></div>
      Vendor Dashboard · Yazzie A4
    </div>
    <div class="hdr-right">
      <a class="nav-back" href="Hall OS Vendor Mobile.html">Mobile view</a>
      <a class="nav-back" href="Hall OS Index.html">← All modules</a>
    </div>
  </header>
  <div class="content">
    <div id="root"></div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="hos-tokens.jsx"></script>
<script type="text/babel" src="hos-data.jsx"></script>
<script type="text/babel" src="hos-shell.jsx"></script>
<script type="text/babel" src="hos-coach.jsx"></script>
<script type="text/babel" src="hos-vendor.jsx"></script>
<script type="text/babel" src="vendor-sections.jsx"></script>

<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<VendorDashboard />);
</script>

</body>
</html>
