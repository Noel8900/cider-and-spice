<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cider &amp; Spice — Homepage Redesign Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    button { font-family: inherit; }
  </style>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="80" fill="#1C1209"/>
      <rect x="20" y="16" width="80" height="48" fill="none" stroke="#C4622D" stroke-width="1"/>
      <text x="60" y="38" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-style="italic" fill="#D4A84B">Cider</text>
      <text x="60" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#F5ECD7" opacity=".5">&amp; Spice</text>
    </svg>
  </template>
</head>
<body>
  <!-- Load design canvas first, then component files in dependency order -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="hero-artboards.jsx"></script>
  <script type="text/babel" src="gallery-artboards.jsx"></script>
  <script type="text/babel" src="mobile-artboards.jsx"></script>

  <div id="root"></div>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas title="Cider &amp; Spice — Homepage Redesign Concepts">

          {/* ── SECTION 1: Hero ───────────────────────────────────────── */}
          <DCSection
            id="hero"
            title="Hero Section — 3 Directions"
            subtitle="A refines the current approach · B introduces an editorial split · C lets the image breathe with anchored content"
          >
            <DCArtboard id="hero-a" label="A · Cinematic" width={1440} height={800}>
              <HeroA />
            </DCArtboard>
            <DCArtboard id="hero-b" label="B · Editorial Split" width={1440} height={800}>
              <HeroB />
            </DCArtboard>
            <DCArtboard id="hero-c" label="C · Atmospheric Anchor" width={1440} height={800}>
              <HeroC />
            </DCArtboard>
          </DCSection>

          {/* ── SECTION 2: Gallery ───────────────────────────────────── */}
          <DCSection
            id="gallery"
            title="Gallery Section — 3 Directions"
            subtitle="A is a clean editorial grid · B adds an asymmetric left-column structure · C is fully interactive with a feature + filmstrip layout"
          >
            <DCArtboard id="gal-a" label="A · Magazine Grid" width={1440} height={620}>
              <GalleryA />
            </DCArtboard>
            <DCArtboard id="gal-b" label="B · Editorial Asymmetric" width={1440} height={620}>
              <GalleryB />
            </DCArtboard>
            <DCArtboard id="gal-c" label="C · Feature + Filmstrip" width={1440} height={620}>
              <GalleryC />
            </DCArtboard>
          </DCSection>

          {/* ── SECTION 3: Mobile ────────────────────────────────────── */}
          <DCSection
            id="mobile"
            title="Mobile Hero — 2 Directions"
            subtitle="A keeps imagery full-bleed with content anchored at the bottom · B splits image and content into clear zones for readability"
          >
            <DCArtboard id="mob-a" label="A · Full-Bleed Anchor" width={390} height={844}>
              <MobileHeroA />
            </DCArtboard>
            <DCArtboard id="mob-b" label="B · Split Layout" width={390} height={844}>
              <MobileHeroB />
            </DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
