<div id="root"></div>

<script type="text/babel">
  function CommunityDirections() {
    return (
      <DesignCanvas>
        <DCSection id="community" title="Community Section — Cider & Spice Homepage" subtitle="Three directions to compare · drops natively into the existing page · open any board fullscreen (↑ expand icon)">
          <DCArtboard id="a" label="A · Editorial Story" width={1280} height={1536}>
            <CommunityA />
          </DCArtboard>
          <DCArtboard id="b" label="B · Impact Ledger" width={1280} height={1496}>
            <CommunityB />
          </DCArtboard>
          <DCArtboard id="c" label="C · Get-Involved First" width={1280} height={1266}>
            <CommunityC />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  function boot() {
    if (!window.DesignCanvas || !window.CommunityA) { setTimeout(boot, 40); return; }
    window.__HP_REVEAL_ALL = true;   // canvas is static — show all reveal content
    ReactDOM.createRoot(document.getElementById('root')).render(<CommunityDirections />);
  }
  boot();
</script>
