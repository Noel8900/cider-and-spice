<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cider &amp; Spice — Las Cruces Culinary Innovation Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: dark; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { background: #1C1209; color: #F5ECD7; font-family: Inter, system-ui, sans-serif; }

    ::-webkit-scrollbar       { width: 5px; }
    ::-webkit-scrollbar-track { background: #0e0c09; }
    ::-webkit-scrollbar-thumb { background: rgba(212,168,75,0.22); border-radius: 3px; }

    ::selection { background: rgba(196,98,45,0.32); color: #F7F3EC; }

    @keyframes hp-bounce {
      0%, 100% { transform: translateY(0);   opacity: .55; }
      50%       { transform: translateY(5px); opacity: 1;   }
    }
    @keyframes hp-marquee {
      0%   { transform: translateX(0);    }
      100% { transform: translateX(-50%); }
    }
    @keyframes hp-kenburns {
      from { transform: scale(1.09); }
      to   { transform: scale(1.00); }
    }
    @keyframes hp-fade-up {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes hp-rule-expand {
      from { width: 0; opacity: 0; }
      to   { width: 56px; opacity: 1; }
    }

    /* Mobile gallery */
    .hp-gallery-desktop { }
    .hp-gallery-mobile  { display: none; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 3px; padding-bottom: 4px; }
    .hp-gallery-mobile::-webkit-scrollbar { display: none; }
    @media (max-width: 640px) {
      .hp-gallery-desktop { display: none !important; }
      .hp-gallery-mobile  { display: flex !important; }
    }
    /* Mobile sticky CTA */
    .hp-mob-cta { display: none; }
    @media (max-width: 768px) {
      .hp-mob-cta { display: flex !important; }
      .hp-nav-links { display: none !important; }
      .hp-hamburger { display: flex !important; }
    }

    /* Responsive grids */
    @media (max-width: 640px) {
      #gallery .img-grid   { grid-template-columns: 1fr !important; grid-template-rows: auto !important; }
      #gallery .img-grid > *:first-child { grid-row: auto !important; grid-column: auto !important; }
    }

    /* Input focus */
    input:focus { outline: 1px solid rgba(196,98,45,0.5); }

    /* Smooth image load */
    img { display: block; }
  </style>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="80" fill="#1C1209"/>
      <rect x="0" y="0" width="120" height="80" fill="url(#g)"/>
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#C4622D" stop-opacity=".18"/>
          <stop offset="100%" stop-color="#1C1209" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="36" y1="32" x2="52" y2="32" stroke="#C4622D" stroke-width=".8"/>
      <text x="60" y="35" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#C4622D">Eats the World</text>
      <text x="60" y="48" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#F5ECD7" opacity=".4">Cider &amp; Spice · Las Cruces</text>
    </svg>
  </template>
</head>
<body>

  <!-- Component scripts — load in dependency order -->
  <script type="text/babel" src="hp-tokens.jsx"></script>
  <script type="text/babel" src="hp-nav-hero.jsx"></script>
  <script type="text/babel" src="hp-sections.jsx"></script>
  <script type="text/babel" src="hp-hall-os.jsx"></script>
  <script type="text/babel" src="hp-community.jsx"></script>
  <script type="text/babel" src="hp-bottom.jsx"></script>

  <div id="root"></div>

  <script type="text/babel">
    function App() {
      return (
        <React.Fragment>
          <HPNav />
          <HPHero />
          <HPTrustBar />
          <HPGallery />
          <HPHallOS />
          <HPCiderBar />
          <HPCiderClub />
          <HPFeatures />
          <HPHowItWorks />
          <HPCommunity />
          <HPStats />
          <HPTimeline />
          <HPFaq />
          <HPCta />
          <HPFooter />
          <HPMobileCta />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
