// Hooks
function useInViewCC(threshold = 0.12) {
  const ref = React.useRef(null);
  const [inView, setInView] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, inView];
}

function FadeUp({ children, delay = 0, style = {} }) {
  const [ref, inView] = useInViewCC();
  return (
    <div ref={ref} style={{ opacity: inView ? 1 : 0, transform: inView ? 'none' : 'translateY(18px)', transition: `opacity .7s ease ${delay}s, transform .7s ease ${delay}s`, ...style }}>
      {children}
    </div>
  );
}

                <button onClick={() => setOpen(isOpen ? null : i)} style={{ width:'100%', background:'none', border:'none', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', padding:'22px 0', gap:20, textAlign:'left' }}>
                  <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:21, fontWeight:300, color: isOpen?CC.cream:`${CC.cream}cc`, lineHeight:1.2, transition:'color .25s' }}>{faq.q}</span>
                  <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:28, color:isOpen?CC.terracotta:`${CC.cream}28`, lineHeight:1, flexShrink:0, transition:'all .3s ease', transform:isOpen?'rotate(45deg)':'rotate(0)', display:'block' }}>+</span>
                </button>
                <div style={{ overflow:'hidden', maxHeight:isOpen?300:0, opacity:isOpen?1:0, transition:'max-height .4s ease, opacity .3s ease' }}>
                  <p style={{ fontFamily:'Inter,sans-serif', fontSize:14, lineHeight:1.82, color:CC.wheat, opacity:.56, paddingBottom:26 }}>{faq.a}</p>
                </div>
              </div>
            </FadeUp>
          );
        })}
        <div style={{ borderTop: `1px solid ${CC.border}` }} />
      </div>
    </section>
  );
}

// Join form
function CCJoin() {
  const [tier, setTier]       = React.useState('enthusiast');
  const [name, setName]       = React.useState('');
  const [email, setEmail]     = React.useState('');
  const [submitted, setSubmit] = React.useState(false);

  const t = TIERS.find(t => t.id === tier);

  const inputSt = { width: '100%', background: 'rgba(255,255,255,.04)', border: `1px solid ${CC.border}`, padding: '13px 16px', fontFamily: 'Inter,sans-serif', fontSize: 14, color: CC.cream, display: 'block' };

  return (
    <section id="join" style={{ background: CC.bg, borderTop: `1px solid ${CC.border}`, padding: 'clamp(72px,9vw,104px) clamp(24px,5vw,72px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(320px,1fr))', gap: 'clamp(40px,6vw,80px)', alignItems: 'start' }}>
        {/* Left: persuasion */}
        <FadeUp>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 18 }}>
            <div style={{ width: 28, height: 1, background: CC.terracotta }} />
            <span style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 9, letterSpacing: '.35em', textTransform: 'uppercase', color: CC.terracotta }}>Pre-Register</span>
          </div>
          <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 'clamp(36px,5vw,54px)', fontWeight: 300, color: CC.cream, lineHeight: .95, marginBottom: 22 }}>
            Reserve Your<br /><em style={{ fontStyle: 'italic', color: CC.terracotta }}>Founding Spot</em>
          </h2>
          <p style={{ fontFamily: 'Inter,sans-serif', fontSize: 14, lineHeight: 1.8, color: CC.wheat, opacity: .55, marginBottom: 36, maxWidth: 400 }}>
            Pre-registration is free and holds your tier. No payment is collected until the Hub opens. Founding Members are confirmed on a first-come, first-served basis — we expect the Founding tier to sell out before the public launch.
          </p>
          {/* Trust signals */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {[['◈','Free to pre-register — no card required'],['◉','Cancel or change tier anytime before launch'],['✦','Founding Members are named permanently in the Hub']].map(([icon, txt]) => (
              <div key={txt} style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
                <span style={{ color: CC.terracotta, fontFamily: "'Cormorant Garamond',serif", fontSize: 16, flexShrink: 0, marginTop: 1 }}>{icon}</span>
                <span style={{ fontFamily: 'Inter,sans-serif', fontSize: 13.5, color: CC.wheat, opacity: .55, lineHeight: 1.5 }}>{txt}</span>
              </div>
            ))}
          </div>
        </FadeUp>

        {/* Right: form */}
        <FadeUp delay={0.15}>
          {submitted ? (
            <div style={{ padding: '48px 36px', border: `1px solid rgba(196,98,45,.3)`, background: 'rgba(196,98,45,.06)', textAlign: 'center' }}>
              <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 36, fontWeight: 300, color: CC.terracotta, marginBottom: 12 }}>✓</div>
              <h3 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 26, fontWeight: 300, color: CC.cream, marginBottom: 10 }}>You're on the list</h3>
              <p style={{ fontFamily: 'Inter,sans-serif', fontSize: 13, lineHeight: 1.7, color: CC.wheat, opacity: .55 }}>We'll email you before the public launch with your Founding Member confirmation. Welcome to the Club.</p>
            </div>
          ) : (
            <form onSubmit={e => { e.preventDefault(); if (name && email) setSubmit(true); }}
              style={{ padding: 'clamp(28px,4vw,40px)', background: 'rgba(255,255,255,.022)', border: `1px solid ${CC.border}`, display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 22, fontWeight: 300, color: CC.cream, marginBottom: 4 }}>Join the Cider Club</div>
              {/* Tier selector */}
              <div>
                <label style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.24em', textTransform: 'uppercase', color: `${CC.cream}45`, display: 'block', marginBottom: 10 }}>Select Tier</label>
                <div style={{ display: 'flex', gap: 2 }}>
                  {TIERS.map(tr => (
                    <button key={tr.id} type="button" onClick={() => setTier(tr.id)}
                      style={{ flex: 1, padding: '10px 8px', fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.15em', textTransform: 'uppercase', cursor: 'pointer', border: `1px solid ${tier===tr.id?`${tr.color}55`:CC.border}`, background: tier===tr.id?`${tr.color}0d`:'transparent', color: tier===tr.id?tr.color:`${CC.cream}45`, transition: 'all .25s' }}>
                      {tr.name.split(' ')[0]}<br />
                      <span style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 14, fontWeight: 300 }}>${tr.price}</span>
                    </button>
                  ))}
                </div>
                <div style={{ fontFamily: 'Inter,sans-serif', fontSize: 11.5, color: `${CC.cream}30`, marginTop: 8 }}>
                  {t.desc}
                </div>
              </div>
              {/* Fields */}
              <div>
                <label style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.24em', textTransform: 'uppercase', color: `${CC.cream}45`, display: 'block', marginBottom: 6 }}>Full Name</label>
                <input type="text" required placeholder="Your name" value={name} onChange={e => setName(e.target.value)} style={inputSt} />
              </div>
              <div>
                <label style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.24em', textTransform: 'uppercase', color: `${CC.cream}45`, display: 'block', marginBottom: 6 }}>Email Address</label>
                <input type="email" required placeholder="your@email.com" value={email} onChange={e => setEmail(e.target.value)} style={inputSt} />
              </div>
              <button type="submit" style={{ background: CC.terracotta, color: CC.parchment, border: 'none', padding: '15px 24px', fontFamily: "'Josefin Sans',sans-serif", fontSize: 9.5, letterSpacing: '.24em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600, transition: 'background .25s' }}
                onMouseEnter={e => e.currentTarget.style.background='#a8521f'} onMouseLeave={e => e.currentTarget.style.background=CC.terracotta}
              >Pre-Register as {t.name} →</button>
              <p style={{ fontFamily: 'Inter,sans-serif', fontSize: 11, color: `${CC.cream}28`, textAlign: 'center', lineHeight: 1.5 }}>No payment collected until opening. Unsubscribe anytime.</p>
            </form>
          )}
        </FadeUp>
      </div>
    </section>
  );
}

// Footer

  return (
    <footer style={{ background: CC.bgDeep, borderTop: `1px solid ${CC.border}`, padding: '32px clamp(24px,5vw,72px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: 16 }}>
        <span style={{ fontFamily: 'Inter,sans-serif', fontSize: 11.5, color: `${CC.cream}28` }}>© 2026 Cider &amp; Spice LLC · Las Cruces, New Mexico</span>
        <div style={{ display: 'flex', gap: 24 }}>
          {[['Homepage','Cider & Spice — Homepage.html'],['Floor Plan','Floor Plan.html']].map(([l,h]) => (
            <a key={l} href={h} style={{ fontFamily: 'Inter,sans-serif', fontSize: 12, color: `${CC.cream}38`, textDecoration: 'none', transition: 'color .2s' }}
              onMouseEnter={e=>e.currentTarget.style.color=CC.cream} onMouseLeave={e=>e.currentTarget.style.color=`${CC.cream}38`}
            >{l}</a>
          ))}
        </div>
        <span style={{ fontFamily: "'Josefin Sans',sans-serif", fontSize: 8, letterSpacing: '.25em', textTransform: 'uppercase', color: `${CC.gold}30` }}>✦ Opening Q1–Q2 2027 ✦</span>
      </div>
    </footer>
  );
}

function App() {
  return (
    <React.Fragment>
      <CCNav />
      <CCHero />
      <CCTiers />
      <CCCompare />
      <CCFaq />
      <CCJoin />
      <CCFooter />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
